name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    name: Tests, ArchUnit, cobertura y formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn verify
        run: ./mvnw -B verify

  docker:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t tunai-api:ci .
