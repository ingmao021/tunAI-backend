spring:
  application:
    name: tunai-api

server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    # Con el valor por defecto (2 MB) Tomcat corta la conexión ante una subida grande en vez de dejar responder 413
    max-swallow-size: 20MB

# F-BE-03 / RNF-BE-008: solo health, sin detalles internos
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      # Render no usa sondas liveness/readiness; sin esto la respuesta incluye "groups" (contrato §15.2)
      probes:
        enabled: false

# Anexo A. El proveedor por defecto es "fake": una llamada real solo ocurre si se configura "stability" o "tripo"
# (RF-BE-021)
tunai:
  generator:
    provider: ${TUNAI_GENERATOR_PROVIDER:fake}
    fake:
      delay: ${TUNAI_FAKE_DELAY:2s}
  # Anexo A. La clave nunca va en este archivo: solo en la variable de entorno STABILITY_API_KEY (RNF-BE-006)
  stability:
    api-key: ${STABILITY_API_KEY:}
    base-url: ${TUNAI_STABILITY_BASE_URL:https://api.stability.ai}
    texture-resolution: ${TUNAI_TEXTURE_RESOLUTION:1024}
    foreground-ratio: ${TUNAI_FOREGROUND_RATIO:0.85}
    remesh: ${TUNAI_REMESH:none}
    vertex-count: ${TUNAI_VERTEX_COUNT:-1}
    connect-timeout: ${TUNAI_STABILITY_CONNECT_TIMEOUT:10s}
    read-timeout: ${TUNAI_STABILITY_READ_TIMEOUT:60s}
  # §13.9. La clave nunca va en este archivo: solo en la variable de entorno TRIPO_API_KEY (RNF-BE-006)
  tripo:
    api-key: ${TRIPO_API_KEY:}
    base-url: ${TUNAI_TRIPO_BASE_URL:https://openapi.tripo3d.ai/v3}
    model: ${TUNAI_TRIPO_MODEL:v3.1-20260211}
    face-limit: ${TUNAI_TRIPO_FACE_LIMIT:50000}
    texture-quality: ${TUNAI_TRIPO_TEXTURE_QUALITY:standard}
    pbr: ${TUNAI_TRIPO_PBR:true}
    connect-timeout: ${TUNAI_TRIPO_CONNECT_TIMEOUT:10s}
    read-timeout: ${TUNAI_TRIPO_READ_TIMEOUT:30s}
    poll-interval: ${TUNAI_TRIPO_POLL_INTERVAL:2s}
    max-wait: ${TUNAI_TRIPO_MAX_WAIT:85s}
  generation:
    max-model-bytes: ${TUNAI_MAX_MODEL_BYTES:20MB}
    max-concurrent: ${TUNAI_MAX_CONCURRENT:2}
  # Créditos por instalación (45, sin renovación) y costo por modelo (15). Los límites diarios por IP y global son los
  # de la demo (2); en desarrollo súbelos, p. ej. TUNAI_QUOTA_PER_IP=50 (§13.8)
  quota:
    initial-credits: ${TUNAI_CREDITS_INITIAL:45}
    credits-per-model: ${TUNAI_CREDITS_PER_MODEL:15}
    per-ip: ${TUNAI_QUOTA_PER_IP:2}
    global-daily: ${TUNAI_QUOTA_GLOBAL_DAILY:2}
    timezone: ${TUNAI_QUOTA_TIMEZONE:America/Bogota}
  # RNF-BE-012: métricas tunai.* en el log, solo si hubo actividad en el intervalo
  metrics:
    log-interval: ${TUNAI_METRICS_LOG_INTERVAL:5m}
  # RF-BE-022: Render va detrás de Cloudflare, que fija CF-Connecting-IP
  client-ip:
    trusted-header: ${TUNAI_CLIENT_IP_HEADER:CF-Connecting-IP}
    trusted-proxies: ${TUNAI_TRUSTED_PROXIES:1}
  image:
    max-bytes: ${TUNAI_MAX_IMAGE_BYTES:10MB}
    min-side: ${TUNAI_MIN_IMAGE_SIDE:512}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
