spring:
  application:
    name: tunai-api

server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    # Con el valor por defecto (2 MB) Tomcat corta la conexión ante una subida grande en vez de dejar responder 413
    max-swallow-size: 20MB

# F-BE-03 / RNF-BE-008: solo health, sin detalles internos
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      # Render no usa sondas liveness/readiness; sin esto la respuesta incluye "groups" (contrato §15.2)
      probes:
        enabled: false

# Anexo A. El proveedor por defecto es "fake": una llamada real solo ocurre si se configura "stability" (RF-BE-021)
tunai:
  generator:
    provider: ${TUNAI_GENERATOR_PROVIDER:fake}
    fake:
      delay: ${TUNAI_FAKE_DELAY:2s}
  generation:
    max-model-bytes: ${TUNAI_MAX_MODEL_BYTES:20MB}
    max-concurrent: ${TUNAI_MAX_CONCURRENT:2}
  # Valores de la demo (2). En desarrollo súbelos, p. ej. TUNAI_QUOTA_PER_INSTALLATION=50 (§13.8)
  quota:
    per-installation: ${TUNAI_QUOTA_PER_INSTALLATION:2}
    per-ip: ${TUNAI_QUOTA_PER_IP:2}
    global-daily: ${TUNAI_QUOTA_GLOBAL_DAILY:2}
    timezone: ${TUNAI_QUOTA_TIMEZONE:America/Bogota}
  # RF-BE-022: Render va detrás de Cloudflare, que fija CF-Connecting-IP
  client-ip:
    trusted-header: ${TUNAI_CLIENT_IP_HEADER:CF-Connecting-IP}
    trusted-proxies: ${TUNAI_TRUSTED_PROXIES:1}
  image:
    max-bytes: ${TUNAI_MAX_IMAGE_BYTES:10MB}
    min-side: ${TUNAI_MIN_IMAGE_SIDE:512}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
